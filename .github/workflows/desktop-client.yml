name: Shared desktop client DEV builds

on:
  workflow_call:
    outputs:
      revision:
        description: Source revision that was built
        value: ${{ jobs.windows-client.outputs.revision || jobs.windows-acceptance.outputs.revision }}
      macos-revision:
        description: Source revision that the macOS executable was built from
        value: ${{ jobs.macos.outputs.revision }}
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      acceptance_release:
        description: 'Optional mnema-xyz/talk release tag to test instead of building'
        required: false
        type: string
      acceptance_instance:
        description: 'Public HTTPS origin for unauthenticated release acceptance'
        required: false
        type: string
      acceptance_fixture:
        description: 'Use an isolated local normal-backend fixture for login/chat/logout'
        required: false
        default: false
        type: boolean
      acceptance_voice:
        description: 'Extend the owned fixture with SFU microphone RTP and voice controls (synthetic input)'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - experimental/**
      - icons/**
      - scripts/**
      - test-vectors/**
      - ui/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/desktop-client.yml
      - .github/workflows/desktop-client-*.yml
  push:
    branches: [main, 'codex/**']
    paths:
      - experimental/**
      - icons/**
      - scripts/**
      - test-vectors/**
      - ui/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/desktop-client.yml
      - .github/workflows/desktop-client-*.yml

permissions:
  contents: read

concurrency:
  group: shared-desktop-${{ inputs.acceptance_release && format('{0}-{1}', inputs.acceptance_release, github.sha) || inputs.tag || github.ref }}
  # Superseded pull request runs are cancelled; tag, push and acceptance runs never are.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-client:
    if: inputs.acceptance_release == ''
    uses: ./.github/workflows/desktop-client-windows.yml
    with:
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}

  windows-acceptance:
    if: inputs.acceptance_release != ''
    uses: ./.github/workflows/desktop-client-acceptance.yml
    with:
      ref: ${{ inputs.ref }}
      acceptance_release: ${{ inputs.acceptance_release }}
      acceptance_instance: ${{ inputs.acceptance_instance }}
      acceptance_fixture: ${{ inputs.acceptance_fixture && true || false }}
      acceptance_voice: ${{ inputs.acceptance_voice && true || false }}

  windows-surfaces:
    if: inputs.acceptance_release == ''
    uses: ./.github/workflows/desktop-client-windows-surfaces.yml
    with:
      ref: ${{ inputs.ref }}

  windows-update:
    if: inputs.acceptance_release == ''
    uses: ./.github/workflows/desktop-client-update.yml
    with:
      ref: ${{ inputs.ref }}

  macos:
    if: inputs.acceptance_release == ''
    uses: ./.github/workflows/desktop-client-macos.yml
    with:
      ref: ${{ inputs.ref }}
      tag: ${{ inputs.tag }}

  real-server:
    if: inputs.acceptance_release == ''
    uses: ./.github/workflows/desktop-client-real-server.yml
    with:
      ref: ${{ inputs.ref }}
